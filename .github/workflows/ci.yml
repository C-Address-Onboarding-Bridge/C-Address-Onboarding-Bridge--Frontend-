name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails a PR whose package.json and package-lock.json disagree for the npm
      # that ships with Node 22 (#845), with a readable diff instead of npm ci's
      # bare "not in sync" error. Regenerate with the same npm major:
      #   npx npm@10 install --package-lock-only --ignore-scripts
      - name: Lockfile is in sync with package.json
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --exit-code --stat package-lock.json; then
            echo "::error file=package-lock.json::package-lock.json is out of sync with package.json for npm $(npm --version). Run: npx npm@10 install --package-lock-only --ignore-scripts"
            git diff package-lock.json | head -80
            exit 1
          fi

      - run: npm ci

      # Blocking. Transitive advisories through @creit.tech/stellar-wallets-kit
      # and @stellar/stellar-sdk are pinned to patched versions via `overrides`
      # in package.json.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Coverage report
        run: npm run test -- --coverage
        continue-on-error: true
      - run: npm run build
        env:
          ENFORCE_BUDGET: "true"
          # A production build now fails fast if this is unset (#675) — CI
          # only verifies the build succeeds, not real backend connectivity,
          # so a placeholder is enough. A real deployment must set its own.
          NEXT_PUBLIC_API_URL: "https://api.ci-placeholder.example"

  # Blocking. The specs in e2e/ are currently skipped (see the TODO at the top
  # of e2e/funding-flow.spec.ts -- their selectors drifted while this job could
  # not run), but the job still starts the app via Playwright's webServer, so a
  # dev server that fails to boot -- as it did under Next 16 -- fails CI.
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 10

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
